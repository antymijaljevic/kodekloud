kubectl config use-context kubernetes-admin@kubernetes

k -n kube-system get po etcd-controlplane  -o jsonpath={.spec.containers[0].command} | jq -r
etcdctl snapshot save /opt/cluster_backup.db --endpoints="https://127.0.0.1:2379" --cacert="/etc/kubernetes/pki/etcd/ca.crt" --cert="/etc/kubernetes/pki/etcd/server.crt" --key="/etc/kubernetes/pki/etcd/server.key" > backup.txt 2>&1